# Firebase App Hosting Configuration for Next.js with Server-Side APIs
kind: AppHostingConfig
schemaVersion: v1
runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 5
env:
  - variable: FIREBASE_PROJECT_ID
    value: gen-lang-client-0175818220
  - variable: NODE_ENV
    value: production
